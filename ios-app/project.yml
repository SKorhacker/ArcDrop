name: ArcDrop
options:
  bundleIdPrefix: app.arcdrop
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Set your Apple team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ArcDrop:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../mesh/ArcMesh.swift
      - path: ../ios/ArcDropRelay.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ArcDrop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: ArcDrop passe tes paiements aux téléphones proches en Bluetooth, sans réseau.
        NSCameraUsageDescription: ArcDrop scanne les QR codes de paiement.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        # Service workers in WKWebView require app-bound domains: they keep the app usable offline.
        WKAppBoundDomains: [arcdrop-pink.vercel.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arcdrop.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
