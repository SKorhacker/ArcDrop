name: ArcDrop
options:
  bundleIdPrefix: app.arcdrop
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Set your Apple team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: "" # your Apple team ID (or pass DEVELOPMENT_TEAM=… to xcodebuild)
    CODE_SIGN_STYLE: Automatic
targets:
  ArcDrop:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Web
        type: folder
        buildPhase: resources
      - path: ../mesh/ArcMesh.swift
      - path: ../ios/ArcDropRelay.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ArcDrop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: ArcDrop passes your payments to nearby phones over Bluetooth, with no network.
        NSCameraUsageDescription: ArcDrop scans payment QR codes.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        # arcdrop://pay#p=… links (AirDrop) open the app directly.
        CFBundleURLTypes:
          - CFBundleURLName: app.arcdrop.pay
            CFBundleURLSchemes: [arcdrop]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arcdrop.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
